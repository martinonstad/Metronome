[package]
name = "metronom-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "metronom_ffi"
crate-type = ["cdylib", "lib"]

[features]
# Only needed to run the `uniffi-bindgen` binary; kept out of the shipped library.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["bindgen"]

[dependencies]
metronom-core = { path = "../metronom-core" }
uniffi = "0.32"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", default-features = false, features = ["audio"] }
