[workspace]
resolver = "3"
members = ["metronom-core", "metronom-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# `metronom-core` additionally has `#![forbid(unsafe_code)]`; only the FFI crate's audio
# module opts in, with a SAFETY comment on every use.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Size matters more than raw speed: the engine is tiny and the audio callback is light.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
